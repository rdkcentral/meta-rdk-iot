# zigbeed reads this file at startup. Each line is a zigbeed command line argument without the leading dashes.
# Command line arguments override the values in this file.

# Spinel radio URL. The interface id (iid) must be unique per host stack sharing the RCP through cpcd.
radio-url=spinel+cpc://cpcd_0?iid=1&iid-list=0

# Pseudo-terminal used for EZSP with the host application (created by zigbeed-socat.service).
ezsp-interface=/tmp/ttyZigbeeNCP

# Spinel driver debug level: 0=NONE, 1=CRIT, 2=WARN, 3=NOTE, 4=INFO, 5=DEBG
debug-level=2
